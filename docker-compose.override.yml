services:
  mongo-express:
    image: mongo-express:1-20
    container_name: wp-sentinel-mongo-gui
    restart: unless-stopped
    ports:
      # Localhost only — reach it via SSH tunnel: ssh -L 8081:localhost:8081 user@server
      - "127.0.0.1:8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_SITE_BASEURL: /mongo/   # <-- ADD THIS LINE
      ME_CONFIG_MONGODB_PORT: "27017"
      ME_CONFIG_MONGODB_ADMINUSERNAME: wpsentinel
      ME_CONFIG_MONGODB_ADMINPASSWORD: Kx9mQ7vLp2wNrT4bZj8X
      ME_CONFIG_BASICAUTH_USERNAME: sentinel_admin
      ME_CONFIG_BASICAUTH_PASSWORD: Gu4dPnL8vXr3KmW7qJ9Z
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - wp-sentinel
